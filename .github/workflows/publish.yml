name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          # [mcp] so the MCP server tests run here too (see ci.yml).
          python -m pip install -e ".[dev,mcp]"
          python -m pip install build

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Lint frontend
        working-directory: ui
        run: npm run lint

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Verify committed static bundle is current
        run: git diff --exit-code -- src/anyscribe/web/static

      # release.sh pushes the commit and tag together, so CI's docs job runs in
      # parallel with this one; gate here or a missing CHANGELOG entry ships.
      - name: Version + capability drift gates
        run: python scripts/check-docs.py

      - name: Render docs
        run: python scripts/build-docs.py

      - name: Committed HTML matches sources
        run: git diff --exit-code landing/docs

      - name: Rehearse migration (fake HOME, throwaway venv)
        run: bash scripts/rehearse-migration.sh

      - name: Build package
        run: python -m build

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
