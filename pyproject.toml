[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "anyscribe"
version = "0.16.5"
description = "CLI tool to download, transcribe, and convert video/audio to structured markdown"
readme = "README.md"
# First-party code is AGPL; the distribution also contains MIT/ISC UI components.
license = "AGPL-3.0-or-later AND MIT AND ISC"
license-files = ["LICENSE", "NOTICE", "src/anyscribe/web/static/THIRD-PARTY-LICENSES.md"]
requires-python = ">=3.10"
authors = [
    {name = "Rish Madaan"},
]
keywords = ["transcription", "whisper", "youtube", "markdown", "obsidian", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    # Plain `typer` (not typer-slim) has bundled rich + shellingham since 0.12,
    # so the old `typer[all]` extra is dead — typer stopped declaring it and pip
    # warned on every install. <1 because 0.x minors are its breaking-change lane.
    "typer>=0.12,<1",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",  # set_key/unset_key rewrite atomically (same-dir temp + os.replace); earlier releases could shutil.move cross-fs
    "httpx>=0.27",
    "yt-dlp>=2024.0",
    "rich>=13.0",
    "beaupy>=3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
]

[project.urls]
Repository = "https://github.com/rishmadaan/anyscribe"
Issues = "https://github.com/rishmadaan/anyscribe/issues"
Documentation = "https://github.com/rishmadaan/anyscribe/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # <0.16: ruff 0.16.0 changed the default rule set (249 new findings) and
    # broke the v0.14.0 publish lint gate. Raise deliberately, fixing findings.
    "ruff>=0.4,<0.16",
    # scripts/build-docs.py renders docs/user/*.md into landing/docs/*.html
    "markdown>=3.5,<4",
]
local = [
    "faster-whisper>=1.0",
]
mcp = [
    # >=2: SDK v2 speaks protocol 2026-07-28 and renamed FastMCP -> MCPServer.
    # <3: the previous unbounded "mcp>=1.0" silently resolved to the v2 major on
    # release day, which deleted mcp.server.fastmcp and broke every fresh
    # install of the extra. Raise the ceiling deliberately, migrating the server.
    "mcp>=2,<3",
]
tray = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
anyscribe = "anyscribe.cli.main:app"
scribe = "anyscribe.cli.main:app"
ascli = "anyscribe.cli.main:app"
anyscribe-mcp = "anyscribe.mcp.server:main"
scribe-mcp = "anyscribe.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anyscribe"]

# Ship the preferred editable source for the compiled UI as well as Python.
[tool.hatch.build.targets.sdist]
include = [
    "/src", "/ui", "/scripts", "/tests", "/docs", "/landing",
    "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE",
    "/CONTRIBUTING.md", "/CHANGELOG.md", "/BACKLOG.md", "/CLAUDE.md", "/AGENTS.md",
    "/install.sh", "/install.ps1", "/.github", "/.gitignore", "/.gitattributes", "/vercel.json",
]
exclude = ["/ui/node_modules", "**/__pycache__", "**/*.pyc", "**/.env", "**/.env.*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that hit the network / disk (set ASCLI_RUN_INTEGRATION=1)",
]
